<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="460" height="90" fill="none">
  <defs>
    <linearGradient id="hEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="60%" stop-color="#00DF82" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="hCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C4FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00DF82" />
    </linearGradient>
    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
  </defs>

  <!-- Left Freestanding Mark (76x76 at x=10, y=7) -->
  <g transform="translate(10, 7) scale(0.76)">
    <circle cx="50" cy="50" r="32" fill="#00DF82" opacity="0.3" filter="url(#hGlow)" />
    <path d="M 76 25 A 35 35 0 1 0 76 75" fill="none" stroke="url(#hEmerald)" stroke-width="13" stroke-linecap="round" />
    <path d="M 42 38 L 84 38" fill="none" stroke="url(#hCyan)" stroke-width="11" stroke-linecap="round" />
    <path d="M 63 38 L 63 68" fill="none" stroke="url(#hCyan)" stroke-width="11" stroke-linecap="round" />
    <circle cx="63" cy="38" r="4" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <g transform="translate(98, 51)">
    <!-- "Common" in deep slate (#0f172a) -->
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.8" fill="#0f172a">
      Common
    </text>
    <!-- "Tech" in neon emerald -->
    <text x="148" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.8" fill="#00df82">
      Tech
    </text>

    <!-- Sub-tagline -->
    <text x="2" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="800" letter-spacing="2.4" fill="#64748b">
      EMPOWERING DIGITAL CONNECTIVITY
    </text>
  </g>
</svg>