<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="460" height="90" fill="none">
  <defs>
    <linearGradient id="hCtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18" />
      <stop offset="50%" stop-color="#0a1628" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>
    <linearGradient id="hCtRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00df82" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="hCtEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00df82" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="hCtCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00df82" />
    </linearGradient>
    <radialGradient id="hCtGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00df82" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>
    <filter id="hGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark (Squircle Icon) -->
  <g transform="translate(10, 8)">
    <rect width="74" height="74" rx="20" fill="url(#hCtBg)" />
    <rect x="1" y="1" width="72" height="72" rx="19" fill="none" stroke="url(#hCtRim)" stroke-width="1.5" />

    <!-- Scaled Monogram Mark -->
    <g transform="translate(37, 37) scale(0.55) translate(-64, -64)">
      <circle cx="64" cy="64" r="40" fill="url(#hCtGlow)" filter="url(#hGlowFilter)" />
      <!-- C Arc -->
      <path
        d="M 96 36 L 68 20 C 44 20 24 38 24 64 C 24 90 44 108 68 108 L 96 92"
        stroke="url(#hCtEmerald)"
        stroke-width="11"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
      <!-- T Elements -->
      <path d="M 50 44 L 98 44" stroke="url(#hCtCyan)" stroke-width="10" stroke-linecap="round" fill="none" />
      <path d="M 74 44 L 74 88" stroke="url(#hCtCyan)" stroke-width="10" stroke-linecap="round" fill="none" />
      <!-- Nodes -->
      <circle cx="96" cy="36" r="6" fill="#00df82" />
      <circle cx="96" cy="92" r="6" fill="#00df82" />
      <circle cx="50" cy="44" r="5" fill="#38bdf8" />
      <circle cx="74" cy="88" r="5.5" fill="#00df82" />
      <circle cx="74" cy="44" r="4.5" fill="#ffffff" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(102, 51)">
    <!-- 'Common' in deep slate -->
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" fill="#0f172a">
      Common
    </text>
    <!-- 'Tech' in glowing neon gradient -->
    <text x="144" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" fill="url(#hCtEmerald)">
      Tech
    </text>

    <!-- Telecom Badge -->
    <g transform="translate(230, -25)">
      <rect width="52" height="18" rx="9" fill="rgba(0, 223, 130, 0.12)" stroke="rgba(0, 223, 130, 0.35)" stroke-width="1" />
      <text x="26" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#00df82" letter-spacing="1">
        TELECOM
      </text>
    </g>

    <!-- Sub-tagline -->
    <text x="2" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" letter-spacing="2.8" fill="#64748b">
      STAY CONNECTED · STAY AHEAD
    </text>
  </g>
</svg>
