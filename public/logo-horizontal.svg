<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="460" height="90" fill="none">
  <defs>
    <linearGradient id="hEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="hPulse" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="hNode" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>
    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark (Squircle Icon) -->
  <g transform="translate(10, 8)">
    <rect width="74" height="74" rx="20" fill="#0b1627" />
    <rect x="1" y="1" width="72" height="72" rx="19" fill="none" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1.2" />

    <!-- Scaled Monogram Mark -->
    <g transform="translate(37, 37) scale(0.48) translate(-64, -64)">
      <circle cx="64" cy="64" r="38" fill="#047857" opacity="0.25" filter="url(#hGlow)" />
      <path d="M 94 36 A 44 44 0 1 0 96 90" fill="none" stroke="url(#hEmerald)" stroke-width="8" stroke-linecap="round" stroke-dasharray="92 8" />
      <path d="M 80 48 A 26 26 0 1 0 84 80" fill="none" stroke="url(#hPulse)" stroke-width="6.5" stroke-linecap="round" />
      <path d="M 44 26 L 84 102" stroke="url(#hEmerald)" stroke-width="8" stroke-linecap="round" />
      <circle cx="94" cy="36" r="6" fill="url(#hNode)" />
      <circle cx="96" cy="90" r="5" fill="url(#hNode)" />
      <circle cx="64" cy="64" r="5" fill="#FFFFFF" />
      <circle cx="84" cy="102" r="5.5" fill="url(#hNode)" />
      <circle cx="44" cy="26" r="4.5" fill="#67E8F9" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(102, 51)">
    <!-- 'mycedi' in deep slate / white -->
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5" fill="#0f172a">
      mycedi
    </text>
    <!-- 'net' in glowing gradient -->
    <text x="126" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5" fill="url(#hEmerald)">
      net
    </text>

    <!-- 'GH' country badge -->
    <g transform="translate(186, -26)">
      <rect width="28" height="18" rx="9" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
      <text x="14" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#059669">
        GH
      </text>
    </g>

    <!-- Sub-tagline -->
    <text x="2" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="2.8" fill="#64748b">
      DATA TELECOM NETWORK
    </text>
  </g>
</svg>