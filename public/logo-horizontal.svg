<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="460" height="90" fill="none">
  <defs>
    <!-- Radiant Cyber Emerald & Hyper Cyan Gradient -->
    <linearGradient id="hBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00DF82" />
      <stop offset="45%" stop-color="#00F59B" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="hGlossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="hRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00DF82" stop-opacity="0.4" />
    </linearGradient>

    <filter id="hShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#040810" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Icon Mark (Squircle Icon) -->
  <g transform="translate(10, 8)">
    <rect width="74" height="74" rx="20" fill="url(#hBrandGrad)" />
    <rect x="1" y="1" width="72" height="72" rx="19" stroke="url(#hRimGrad)" stroke-width="1.5" />
    <path
      d="M 0 20 C 0 9 9 0 20 0 L 54 0 C 65 0 74 9 74 20 L 74 32 C 48 22 24 31 0 43 Z"
      fill="url(#hGlossGrad)"
    />

    <!-- Scaled Monogram Mark -->
    <g transform="translate(37, 37) scale(0.55) translate(-64, -64)" filter="url(#hShadow)">
      <path
        d="M 94 36 A 34 34 0 1 0 94 92"
        fill="none"
        stroke="#060d19"
        stroke-width="15"
        stroke-linecap="round"
      />
      <path
        d="M 52 48 L 96 48"
        fill="none"
        stroke="#060d19"
        stroke-width="13.5"
        stroke-linecap="round"
      />
      <path
        d="M 74 48 L 74 84"
        fill="none"
        stroke="#060d19"
        stroke-width="13.5"
        stroke-linecap="round"
      />
      <circle cx="74" cy="48" r="4" fill="#00DF82" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(102, 51)">
    <!-- 'Common' in deep slate -->
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" fill="#0f172a">
      Common
    </text>
    <!-- 'Tech' in neon emerald -->
    <text x="144" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" fill="#00df82">
      Tech
    </text>

    <!-- Telecom Badge -->
    <g transform="translate(230, -25)">
      <rect width="52" height="18" rx="9" fill="rgba(0, 223, 130, 0.12)" stroke="rgba(0, 223, 130, 0.35)" stroke-width="1" />
      <text x="26" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#00df82" letter-spacing="1">
        TELECOM
      </text>
    </g>

    <!-- Sub-tagline -->
    <text x="2" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" letter-spacing="2.8" fill="#64748b">
      STAY CONNECTED · STAY AHEAD
    </text>
  </g>
</svg>
