<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="ctEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="60%" stop-color="#00DF82" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="ctCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C4FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00DF82" />
    </linearGradient>
    <filter id="ctGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Radiant Core Glow -->
  <circle cx="50" cy="50" r="32" fill="#00DF82" opacity="0.3" filter="url(#ctGlow)" />

  <!-- "C" Arc (Bold 13px width, 270 degree continuous loop) -->
  <path
    d="M 76 25 A 35 35 0 1 0 76 75"
    fill="none"
    stroke="url(#ctEmerald)"
    stroke-width="13"
    stroke-linecap="round"
  />

  <!-- "T" Element (Bold 11px width) -->
  <path
    d="M 42 38 L 84 38"
    fill="none"
    stroke="url(#ctCyan)"
    stroke-width="11"
    stroke-linecap="round"
  />
  <path
    d="M 63 38 L 63 68"
    fill="none"
    stroke="url(#ctCyan)"
    stroke-width="11"
    stroke-linecap="round"
  />

  <!-- Luminous Signal Node at T Apex -->
  <circle cx="63" cy="38" r="4" fill="#ffffff" />
</svg>