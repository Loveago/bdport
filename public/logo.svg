<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" fill="none">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00DF82" />
      <stop offset="45%" stop-color="#00F59B" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="logoGlossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="logoRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00DF82" stop-opacity="0.4" />
    </linearGradient>

    <filter id="logoDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#040810" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Central Brand Icon Mark (Squircle) -->
  <g transform="translate(190, 30)">
    <rect width="220" height="220" rx="58" fill="url(#logoBgGrad)" />
    <rect x="2" y="2" width="216" height="216" rx="56" stroke="url(#logoRimGrad)" stroke-width="3" />
    <path
      d="M 0 58 C 0 26 26 0 58 0 L 162 0 C 194 0 220 26 220 58 L 220 96 C 140 66 72 92 0 128 Z"
      fill="url(#logoGlossGrad)"
    />

    <!-- Scaled Monogram (center at 110, 110) -->
    <g transform="translate(110, 110) scale(1.4) translate(-64, -64)" filter="url(#logoDropShadow)">
      <path
        d="M 94 36 A 34 34 0 1 0 94 92"
        fill="none"
        stroke="#060d19"
        stroke-width="15"
        stroke-linecap="round"
      />
      <path
        d="M 52 48 L 96 48"
        fill="none"
        stroke="#060d19"
        stroke-width="13.5"
        stroke-linecap="round"
      />
      <path
        d="M 74 48 L 74 84"
        fill="none"
        stroke="#060d19"
        stroke-width="13.5"
        stroke-linecap="round"
      />
      <circle cx="74" cy="48" r="4" fill="#00DF82" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(300, 345)">
    <!-- Wordmark -->
    <text text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
      <tspan fill="#0f172a">Common</tspan><tspan fill="#00df82">Tech</tspan>
    </text>

    <!-- Tagline -->
    <text y="55" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="6" fill="#00df82">
      DATA TELECOM NETWORK
    </text>

    <!-- Secondary Tagline -->
    <text y="100" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#64748b">
      EMPOWERING DIGITAL CONNECTIVITY
    </text>
  </g>
</svg>
