<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500" fill="none">
  <defs>
    <linearGradient id="lEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="60%" stop-color="#00DF82" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="lCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C4FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00DF82" />
    </linearGradient>
    <filter id="lGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
  </defs>

  <!-- Central Freestanding Mark (scale 2.2 at x=190, y=40) -->
  <g transform="translate(190, 40) scale(2.2)">
    <circle cx="50" cy="50" r="32" fill="#00DF82" opacity="0.3" filter="url(#lGlow)" />
    <path d="M 76 25 A 35 35 0 1 0 76 75" fill="none" stroke="url(#lEmerald)" stroke-width="13" stroke-linecap="round" />
    <path d="M 42 38 L 84 38" fill="none" stroke="url(#lCyan)" stroke-width="11" stroke-linecap="round" />
    <path d="M 63 38 L 63 68" fill="none" stroke="url(#lCyan)" stroke-width="11" stroke-linecap="round" />
    <circle cx="63" cy="38" r="4" fill="#ffffff" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(300, 340)">
    <text text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">
      <tspan fill="#0f172a">Common</tspan><tspan fill="#00df82">Tech</tspan>
    </text>
    <text y="50" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="6" fill="#00df82">
      DATA TELECOM NETWORK
    </text>
    <text y="90" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#64748b">
      EMPOWERING DIGITAL CONNECTIVITY
    </text>
  </g>
</svg>