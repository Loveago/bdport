<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" fill="none">
  <defs>
    <linearGradient id="logoBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18" />
      <stop offset="50%" stop-color="#0a1628" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>
    <linearGradient id="logoEmeraldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00df82" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="logoCyanDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00df82" />
    </linearGradient>
    <radialGradient id="logoGlowDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00df82" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>
    <filter id="logoGlowFilterDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Central Brand Icon Mark (Squircle) -->
  <g transform="translate(190, 30)">
    <rect width="220" height="220" rx="56" fill="url(#logoBgDark)" />
    <rect x="2" y="2" width="216" height="216" rx="54" fill="none" stroke="rgba(0, 223, 130, 0.45)" stroke-width="3" />

    <!-- Scaled Monogram (center at 110, 110) -->
    <g transform="translate(110, 110) scale(1.4) translate(-64, -64)">
      <!-- Ambient Glow -->
      <circle cx="64" cy="64" r="44" fill="url(#logoGlowDark)" filter="url(#logoGlowFilterDark)" />

      <!-- "C" Outer Arc -->
      <path
        d="M 96 36 L 68 20 C 44 20 24 38 24 64 C 24 90 44 108 68 108 L 96 92"
        stroke="url(#logoEmeraldDark)"
        stroke-width="11"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />

      <!-- "T" Element -->
      <path d="M 50 44 L 98 44" stroke="url(#logoCyanDark)" stroke-width="10" stroke-linecap="round" fill="none" />
      <path d="M 74 44 L 74 88" stroke="url(#logoCyanDark)" stroke-width="10" stroke-linecap="round" fill="none" />

      <!-- Nodes -->
      <circle cx="96" cy="36" r="6" fill="#00df82" />
      <circle cx="96" cy="92" r="6" fill="#00df82" />
      <circle cx="50" cy="44" r="5" fill="#38bdf8" />
      <circle cx="74" cy="88" r="5.5" fill="#00df82" />
      <circle cx="74" cy="44" r="4.5" fill="#ffffff" />
      <circle cx="74" cy="44" r="7.5" stroke="#00df82" stroke-width="1.5" stroke-opacity="0.8" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(300, 345)">
    <!-- Wordmark -->
    <text text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
      <tspan fill="#ffffff">Common</tspan><tspan fill="url(#logoEmeraldDark)">Tech</tspan>
    </text>

    <!-- Tagline -->
    <text y="55" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="6" fill="#00df82">
      DATA TELECOM NETWORK
    </text>

    <!-- Secondary Tagline -->
    <text y="100" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#94a3b8">
      STAY CONNECTED · STAY AHEAD
    </text>
  </g>
</svg>
