<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Radiant Cyber Emerald & Hyper Cyan Gradient -->
    <linearGradient id="ctFavGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00DF82" />
      <stop offset="45%" stop-color="#00F59B" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Gloss Top Highlight -->
    <linearGradient id="ctFavGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Outer Rim Highlight -->
    <linearGradient id="ctFavRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00DF82" stop-opacity="0.4" />
    </linearGradient>

    <filter id="ctFavShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#040810" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base (Radius 34) -->
  <rect width="128" height="128" rx="34" fill="url(#ctFavGrad)" />
  <rect x="1.5" y="1.5" width="125" height="125" rx="32.5" stroke="url(#ctFavRim)" stroke-width="2" />

  <!-- Premium Top Gloss Overlay -->
  <path
    d="M 0 34 C 0 15 15 0 34 0 L 94 0 C 113 0 128 15 128 34 L 128 56 C 82 38 46 54 0 74 Z"
    fill="url(#ctFavGloss)"
  />

  <!-- The Iconic Geometric "CT" Monogram -->
  <g filter="url(#ctFavShadow)">
    <!-- "C" Arc: Bold, confident, sweeping outer contour -->
    <path
      d="M 94 36 A 34 34 0 1 0 94 92"
      fill="none"
      stroke="#060d19"
      stroke-width="15"
      stroke-linecap="round"
    />

    <!-- "T" Element: Crossbar & Stem nested harmoniously inside -->
    <path
      d="M 52 48 L 96 48"
      fill="none"
      stroke="#060d19"
      stroke-width="13.5"
      stroke-linecap="round"
    />
    <path
      d="M 74 48 L 74 84"
      fill="none"
      stroke="#060d19"
      stroke-width="13.5"
      stroke-linecap="round"
    />

    <!-- Central High-Speed Telecom Pulse Beacon -->
    <circle cx="74" cy="48" r="4" fill="#00DF82" />
  </g>
</svg>
