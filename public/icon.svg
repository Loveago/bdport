<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Background Gradient: Deep Obsidian Slate -->
    <linearGradient id="ctFavBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18" />
      <stop offset="50%" stop-color="#0a1628" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>

    <!-- Outer Chamfer Rim Gradient -->
    <linearGradient id="ctFavRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00df82" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7" />
    </linearGradient>

    <!-- Neon Emerald Gradient for "C" Arc -->
    <linearGradient id="ctEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00df82" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Electric Cyan Gradient for "T" Element -->
    <linearGradient id="ctCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00df82" />
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="ctCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00df82" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>

    <!-- Spherical Node Shines -->
    <radialGradient id="ctNodeShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#a7f3d0" />
      <stop offset="75%" stop-color="#00df82" />
      <stop offset="100%" stop-color="#059669" />
    </radialGradient>
  </defs>

  <!-- Container Squircle Badge -->
  <rect width="128" height="128" rx="28" fill="url(#ctFavBg)" />
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" stroke="url(#ctFavRim)" stroke-width="1.75" />

  <!-- Ambient Light Core -->
  <circle cx="64" cy="64" r="44" fill="url(#ctCoreGlow)" />

  <!-- "C" Outer Hex/Arc Stream (Common) -->
  <path
    d="M 96 36 L 68 20 C 44 20 24 38 24 64 C 24 90 44 108 68 108 L 96 92"
    stroke="url(#ctEmerald)"
    stroke-width="10.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- "T" Tech Element: Crossbar & Central Stem -->
  <!-- Top Horizontal Bar of T -->
  <path
    d="M 50 44 L 98 44"
    stroke="url(#ctCyan)"
    stroke-width="9.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Vertical Stem of T with Telecom Pulse Foot -->
  <path
    d="M 74 44 L 74 88"
    stroke="url(#ctCyan)"
    stroke-width="9.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Connectivity Nodes & High-Tech Accents -->
  <circle cx="96" cy="36" r="6" fill="url(#ctNodeShine)" />
  <circle cx="96" cy="92" r="6" fill="url(#ctNodeShine)" />
  <circle cx="50" cy="44" r="5" fill="#38bdf8" />
  <circle cx="74" cy="88" r="5.5" fill="url(#ctNodeShine)" />

  <!-- Central Pulse Beacon at CT Junction -->
  <circle cx="74" cy="44" r="4.5" fill="#ffffff" />
  <circle cx="74" cy="44" r="7.5" stroke="#00df82" stroke-width="1.5" stroke-opacity="0.8" />
</svg>
