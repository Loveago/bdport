<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="storeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041d17" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#031410" />
    </linearGradient>

    <!-- Neon Emerald Gradient -->
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cyan Pulse Gradient -->
    <linearGradient id="cyanPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Golden Data Energy Gradient -->
    <linearGradient id="goldEnergy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="storeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="128" height="128" rx="30" fill="url(#storeBg)" />

  <!-- Outer Ambient Ring -->
  <rect x="2.5" y="2.5" width="123" height="123" rx="27.5" fill="none" stroke="url(#neonEmerald)" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Ambient Glow Behind Icon -->
  <circle cx="64" cy="64" r="32" fill="#059669" opacity="0.25" filter="url(#storeGlow)" />

  <!-- STOREFRONT AWNING / CANOPY -->
  <!-- Top Awning Beam -->
  <rect x="26" y="26" width="76" height="8" rx="4" fill="url(#neonEmerald)" />

  <!-- Awning Drapes / Stripes -->
  <!-- Stripe 1 (Left - Emerald) -->
  <path d="M 28 34 L 33 58 C 33 63 43 63 43 58 L 41 34 Z" fill="url(#neonEmerald)" />
  <!-- Stripe 2 (Center-Left - Cyan) -->
  <path d="M 43 34 L 45 58 C 45 63 55 63 55 58 L 55 34 Z" fill="url(#cyanPulse)" />
  <!-- Stripe 3 (Center-Right - Gold) -->
  <path d="M 57 34 L 57 58 C 57 63 67 63 67 58 L 69 34 Z" fill="url(#goldEnergy)" />
  <!-- Stripe 4 (Right - Cyan) -->
  <path d="M 71 34 L 71 58 C 71 63 81 63 81 58 L 83 34 Z" fill="url(#cyanPulse)" />
  <!-- Stripe 5 (Far Right - Emerald) -->
  <path d="M 85 34 L 83 58 C 83 63 93 63 93 58 L 98 34 Z" fill="url(#neonEmerald)" />

  <!-- STORE BODY / BAG -->
  <path d="M 34 66 L 37 98 C 37.5 102.5 41 106 45.5 106 L 82.5 106 C 87 106 90.5 102.5 91 98 L 94 66 Z" 
        fill="#041f17" 
        stroke="url(#neonEmerald)" 
        stroke-width="3" 
        stroke-linejoin="round" />

  <!-- Bag Handle / Arc -->
  <path d="M 49 68 C 49 57 79 57 79 68" 
        fill="none" 
        stroke="url(#neonEmerald)" 
        stroke-width="3.5" 
        stroke-linecap="round" />

  <!-- TELECOM DATA SIGNAL / BOLT IN CENTER OF STORE -->
  <g transform="translate(64, 87)">
    <!-- Center Core Dot -->
    <circle cx="0" cy="8" r="3.5" fill="url(#goldEnergy)" />

    <!-- Wave 1 -->
    <path d="M -9 1 A 13 13 0 0 1 9 1" fill="none" stroke="url(#goldEnergy)" stroke-width="2.8" stroke-linecap="round" />

    <!-- Wave 2 -->
    <path d="M -16 -6 A 23 23 0 0 1 16 -6" fill="none" stroke="url(#neonEmerald)" stroke-width="2.8" stroke-linecap="round" />
  </g>
</svg>
